<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Euronova CTF - Challenge Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans flex flex-col">

  <!-- Header -->
  <header class="border-b border-gray-800 bg-gray-900 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="bg-blue-600/20 p-2 rounded-lg border border-blue-500/30">
        <i data-lucide="shield-alert" class="w-6 h-6 text-blue-400"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">
          Euronova CTF Portal
        </h1>
        <p class="text-xs text-gray-400">Official Event Challenge Directory</p>
      </div>
    </div>

    <!-- Category Filter -->
    <div class="flex bg-gray-950 p-1 rounded-xl border border-gray-800 text-xs font-medium" id="filterButtons">
      <button onclick="filterCategory('All')" class="filter-btn active px-3 py-1.5 rounded-lg bg-blue-600 text-white transition">All Rooms</button>
      <button onclick="filterCategory('Juniors')" class="filter-btn px-3 py-1.5 rounded-lg text-gray-400 hover:text-white transition">Juniors (1st & 2nd Yr)</button>
      <button onclick="filterCategory('Seniors')" class="filter-btn px-3 py-1.5 rounded-lg text-gray-400 hover:text-white transition">Seniors (3rd & 4th Yr)</button>
    </div>
  </header>

  <!-- Main Challenge Grid -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-6">
    <div class="mb-6">
      <h2 class="text-lg font-bold text-white flex items-center space-x-2">
        <i data-lucide="terminal" class="w-5 h-5 text-emerald-400"></i>
        <span>Active Challenge Rooms</span>
      </h2>
      <p class="text-xs text-gray-400">Select your track and click "Join Room" to open the challenge on the official platform.</p>
    </div>

    <!-- Cards Grid -->
    <div id="roomsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- Cards will be populated dynamically -->
    </div>
  </main>

  <script>
    // EDIT YOUR CHALLENGE ROOMS HERE
    const ROOMS = [
      {
        id: 1,
        title: "Sanity Check & Web Recon",
        category: "Juniors",
        difficulty: "Easy",
        points: 50,
        platform: "TryHackMe / CTF Host",
        description: "Inspect HTTP headers and source code to recover the first flag.",
        officialLink: "https://tryhackme.com" // Replace with your actual challenge URL
      },
      {
        id: 2,
        title: "Basic Steganography",
        category: "Juniors",
        difficulty: "Easy",
        points: 100,
        platform: "Official Server",
        description: "Extract hidden text from the provided image payload.",
        officialLink: "https://ctftime.org" // Replace with your actual challenge URL
      },
      {
        id: 3,
        title: "Binary Exploitation - Buffer Overflow",
        category: "Seniors",
        difficulty: "Hard",
        points: 300,
        platform: "HackTheBox",
        description: "Analyze the C binary, overflow the stack frame, and hijack execution.",
        officialLink: "https://hackthebox.com" // Replace with your actual challenge URL
      },
      {
        id: 4,
        title: "Reverse Engineering ELF",
        category: "Seniors",
        difficulty: "Medium",
        points: 200,
        platform: "Official Server",
        description: "Decompile the Linux executable using Ghidra to bypass password validation.",
        officialLink: "https://google.com" // Replace with your actual challenge URL
      }
    ];

    function renderRooms(filter = 'All') {
      const grid = document.getElementById('roomsGrid');
      grid.innerHTML = '';

      const filtered = filter === 'All' ? ROOMS : ROOMS.filter(r => r.category === filter);

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500 text-sm">No rooms found for this category.</div>`;
        return;
      }

      filtered.forEach(room => {
        const diffColor = room.difficulty === 'Easy' ? 'text-emerald-400 border-emerald-500/30 bg-emerald-500/10' :
                         room.difficulty === 'Medium' ? 'text-amber-400 border-amber-500/30 bg-amber-500/10' :
                         'text-red-400 border-red-500/30 bg-red-500/10';

        const cardHtml = `
          <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 flex flex-col justify-between hover:border-blue-500/50 transition">
            <div>
              <div class="flex items-center justify-between mb-3">
                <span class="text-[10px] uppercase font-bold tracking-wider px-2.5 py-0.5 rounded-full border ${diffColor}">
                  ${room.difficulty}
                </span>
                <span class="text-xs font-mono font-semibold text-blue-400 bg-blue-500/10 px-2 py-0.5 rounded border border-blue-500/20">
                  ${room.points} PTS
                </span>
              </div>

              <h3 class="text-base font-bold text-white mb-1">${room.title}</h3>
              <p class="text-xs text-gray-400 mb-4 leading-relaxed">${room.description}</p>
            </div>

            <div>
              <div class="flex justify-between items-center text-[11px] text-gray-500 mb-3 pt-3 border-t border-gray-800/60 font-mono">
                <span>Track: <strong class="text-gray-300">${room.category}</strong></span>
                <span>Host: <strong class="text-gray-300">${room.platform}</strong></span>
              </div>

              <a 
                href="${room.officialLink}" 
                target="_blank" 
                rel="noopener noreferrer"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 px-4 rounded-xl text-xs flex items-center justify-center space-x-2 transition shadow-lg shadow-blue-600/20"
              >
                <span>Join Room</span>
                <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
              </a>
            </div>
          </div>
        `;
        grid.innerHTML += cardHtml;
      });

      lucide.createIcons();
    }

    function filterCategory(category) {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white');
        btn.classList.add('text-gray-400');
      });
      event.target.classList.add('bg-blue-600', 'text-white');
      event.target.classList.remove('text-gray-400');

      renderRooms(category);
    }

    // Initial Render
    renderRooms();
  </script>
</body>
</html>
