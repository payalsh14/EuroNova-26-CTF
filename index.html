<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Euronova CTF - Student Registration</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="bg-gray-900 border border-gray-800 rounded-2xl w-full max-w-md p-6 shadow-2xl">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">
        Euronova CTF Registration
      </h1>
      <p class="text-xs text-gray-400 mt-1">Select your track and enter team details to begin</p>
    </div>

    <form id="ctfRegisterForm" class="space-y-5">
      
      <!-- Category Selection (Juniors / Seniors) -->
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">
          Select Category <span class="text-red-400">*</span>
        </label>
        <div class="grid grid-cols-2 gap-3">
          <label class="flex items-center justify-center p-3 rounded-xl border border-gray-800 bg-gray-950 cursor-pointer hover:border-blue-500 transition has-[:checked]:border-blue-500 has-[:checked]:bg-blue-500/10">
            <input type="radio" name="category" value="Juniors" class="sr-only" required />
            <div class="text-center">
              <span class="block text-sm font-semibold text-white">Juniors</span>
              <span class="block text-[10px] text-gray-400">1st & 2nd Year</span>
            </div>
          </label>

          <label class="flex items-center justify-center p-3 rounded-xl border border-gray-800 bg-gray-950 cursor-pointer hover:border-blue-500 transition has-[:checked]:border-blue-500 has-[:checked]:bg-blue-500/10">
            <input type="radio" name="category" value="Seniors" class="sr-only" required />
            <div class="text-center">
              <span class="block text-sm font-semibold text-white">Seniors</span>
              <span class="block text-[10px] text-gray-400">3rd & 4th Year</span>
            </div>
          </label>
        </div>
      </div>

      <!-- Team Name -->
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">
          Team Name <span class="text-red-400">*</span>
        </label>
        <input 
          type="text" 
          id="teamName" 
          required 
          placeholder="e.g. CyberKnights" 
          class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500"
        />
      </div>

      <!-- Team Leader ID / Roll -->
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">
          Team Leader Roll / ID <span class="text-red-400">*</span>
        </label>
        <input 
          type="text" 
          id="rollId" 
          required 
          placeholder="e.g. 21CS042" 
          class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500"
        />
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        className="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-lg text-sm transition shadow-lg shadow-blue-600/20"
        style="width: 100%; background-color: #2563eb; color: white; padding: 0.625rem; border-radius: 0.5rem; font-weight: 500; text-align: center; cursor: pointer;"
      >
        Enter CTF Arena
      </button>

    </form>
  </div>

  <script>
    document.getElementById('ctfRegisterForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const category = document.querySelector('input[name="category"]:checked')?.value;
      const teamName = document.getElementById('teamName').value.trim();
      const rollId = document.getElementById('rollId').value.trim();

      if (!category || !teamName || !rollId) {
        alert("Please complete all required fields.");
        return;
      }

      // Store CTF Registration state locally
      const ctfSession = { category, teamName, rollId, registeredAt: new Date().toISOString() };
      localStorage.setItem('euronova_ctf_session', JSON.stringify(ctfSession));

      alert(`Registration Successful!\nTrack: ${category}\nTeam: ${teamName}`);
      
      // Redirect to CTF challenge arena if available
      // window.location.href = "arena.html";
    });
  </script>
</body>
</html>
